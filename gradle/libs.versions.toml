[versions]
agp                         = "8.7.3"
kotlin                      = "2.0.21"
ksp                         = "2.0.21-1.0.28"

coreKtx                     = "1.15.0"
appcompat                   = "1.7.0"
activityCompose             = "1.10.0"
lifecycleRuntimeKtx         = "2.8.7"
lifecycleViewmodelCompose   = "2.8.7"

composeBom                  = "2025.02.00"
navigationCompose           = "2.8.7"

hilt                        = "2.54"
hiltNavigationCompose       = "1.2.0"

room                        = "2.6.1"
datastore                   = "1.1.2"
workManager                 = "2.11.2"
hiltWork                    = "1.2.0"

# Google Sign-In (Firebase Auth의 ID 토큰 교환용)
playServicesAuth            = "21.2.0"

# Firebase(Firestore·Auth) — 2026-08-22, 구글시트 릴레이(SheetsSyncWorker)를 대체
firebaseBom                  = "33.5.0"
googleServicesPlugin         = "4.5.0"
coroutinesPlayServices        = "1.9.0"

coroutines                  = "1.9.0"

junit                       = "4.13.2"
junitExt                    = "1.2.1"
espressoCore                = "3.6.1"
mockk                       = "1.13.13"
turbine                     = "1.2.0"
coroutinesTest              = "1.9.0"

[libraries]
androidx-core-ktx                    = { group = "androidx.core",         name = "core-ktx",                       version.ref = "coreKtx" }
androidx-appcompat                   = { group = "androidx.appcompat",     name = "appcompat",                      version.ref = "appcompat" }
androidx-activity-compose            = { group = "androidx.activity",      name = "activity-compose",               version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-compose",    version.ref = "lifecycleViewmodelCompose" }

androidx-compose-bom                 = { group = "androidx.compose",       name = "compose-bom",                    version.ref = "composeBom" }
androidx-compose-ui                  = { group = "androidx.compose.ui",    name = "ui" }
androidx-compose-ui-graphics         = { group = "androidx.compose.ui",    name = "ui-graphics" }
androidx-compose-ui-tooling-preview  = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-compose-ui-tooling          = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-compose-ui-test-manifest    = { group = "androidx.compose.ui",    name = "ui-test-manifest" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui",    name = "ui-test-junit4" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose          = { group = "androidx.navigation",    name = "navigation-compose",             version.ref = "navigationCompose" }

hilt-android                         = { group = "com.google.dagger",      name = "hilt-android",                   version.ref = "hilt" }
hilt-compiler                        = { group = "com.google.dagger",      name = "hilt-android-compiler",          version.ref = "hilt" }
hilt-navigation-compose              = { group = "androidx.hilt",          name = "hilt-navigation-compose",        version.ref = "hiltNavigationCompose" }
hilt-work                            = { group = "androidx.hilt",          name = "hilt-work",                      version.ref = "hiltWork" }
hilt-work-compiler                   = { group = "androidx.hilt",          name = "hilt-compiler",                  version.ref = "hiltWork" }

room-runtime                         = { group = "androidx.room",          name = "room-runtime",                   version.ref = "room" }
room-ktx                             = { group = "androidx.room",          name = "room-ktx",                       version.ref = "room" }
room-compiler                        = { group = "androidx.room",          name = "room-compiler",                   version.ref = "room" }

datastore-preferences                = { group = "androidx.datastore",     name = "datastore-preferences",          version.ref = "datastore" }
work-runtime-ktx                     = { group = "androidx.work",          name = "work-runtime-ktx",               version.ref = "workManager" }

play-services-auth                   = { group = "com.google.android.gms", name = "play-services-auth",             version.ref = "playServicesAuth" }

firebase-bom                         = { group = "com.google.firebase",    name = "firebase-bom",                   version.ref = "firebaseBom" }
firebase-auth                        = { group = "com.google.firebase",    name = "firebase-auth" }
firebase-firestore                   = { group = "com.google.firebase",    name = "firebase-firestore" }

kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-core",        version.ref = "coroutines" }
kotlinx-coroutines-play-services     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }

junit                                = { group = "junit",                   name = "junit",                          version.ref = "junit" }
androidx-junit-ext                   = { group = "androidx.test.ext",       name = "junit",                          version.ref = "junitExt" }
androidx-espresso-core               = { group = "androidx.test.espresso",  name = "espresso-core",                  version.ref = "espressoCore" }
mockk                                = { group = "io.mockk",                name = "mockk",                          version.ref = "mockk" }
turbine                              = { group = "app.cash.turbine",         name = "turbine",                        version.ref = "turbine" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",        version.ref = "coroutinesTest" }

[bundles]
compose = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-navigation-compose",
    "androidx-activity-compose",
    "androidx-lifecycle-viewmodel-compose",
]
room = ["room-runtime", "room-ktx"]
test-unit = ["junit", "mockk", "turbine", "kotlinx-coroutines-test"]
test-android = ["androidx-junit-ext", "androidx-espresso-core", "androidx-compose-ui-test-junit4"]

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
google-services     = { id = "com.google.gms.google-services",      version.ref = "googleServicesPlugin" }
